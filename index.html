<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>visualizer2</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header id="toolbar">
    <div class="toolbar-group">
      <button id="btn-add-node" title="Add Node">+ Node</button>
      <button id="btn-add-edge" title="Connect two nodes">+ Edge</button>
      <button id="btn-delete" title="Delete selected">Delete</button>
      <button id="btn-undo" title="Undo (Ctrl+Z)" disabled>Undo</button>
      <button id="btn-redo" title="Redo (Ctrl+Shift+Z)" disabled>Redo</button>
    </div>
    <div class="toolbar-group">
      <label for="layout-select">Layout</label>
      <select id="layout-select">
        <option value="grid">Grid</option>
        <option value="circle">Circle</option>
        <option value="concentric">Concentric</option>
        <option value="breadthfirst">Breadthfirst</option>
        <option value="cose">Cose (force-directed)</option>
      </select>
    </div>
    <div class="toolbar-group">
      <button id="btn-save">Save JSON</button>
      <button id="btn-load">Load JSON</button>
      <input type="file" id="file-input" accept="application/json" hidden />
    </div>
  </header>

  <div id="app">
    <aside id="left-panel">
      <h2>Search</h2>
      <input type="text" id="search-input" placeholder="Search nodes by label..." />
      <div id="search-results"></div>

      <h2>Elements</h2>
      <ul id="element-list"></ul>
    </aside>

    <main id="canvas-wrap">
      <div id="cy"></div>
      <p id="mode-indicator" class="hidden"></p>
      <p id="canvas-hint">Drag: pan · Shift+drag: box-select · Right-click: menu</p>
    </main>

    <aside id="right-panel">
      <h2>Properties</h2>
      <div id="properties-empty">Select a node or edge to edit its properties.</div>
      <div id="properties-multi" class="hidden"></div>
      <form id="properties-form" class="hidden">
        <label for="prop-label">Label</label>
        <input type="text" id="prop-label" />

        <div id="node-fields">
          <label for="prop-category">Category</label>
          <input type="text" id="prop-category" />

          <label for="prop-group">Group</label>
          <input type="text" id="prop-group" />

          <label for="prop-shape">Shape</label>
          <select id="prop-shape">
            <option value="ellipse">Ellipse</option>
            <option value="rectangle">Rectangle</option>
            <option value="round-rectangle">Round rectangle</option>
            <option value="diamond">Diamond</option>
            <option value="hexagon">Hexagon</option>
            <option value="triangle">Triangle</option>
            <option value="star">Star</option>
          </select>

          <label for="prop-color">Color</label>
          <input type="color" id="prop-color" />

          <label for="prop-width">Width</label>
          <input type="number" id="prop-width" min="10" max="300" />

          <label for="prop-height">Height</label>
          <input type="number" id="prop-height" min="10" max="300" />

          <label for="prop-icon">Icon URL</label>
          <input type="text" id="prop-icon" placeholder="https://..." />

          <label for="prop-docurl">Documentation URL</label>
          <input type="text" id="prop-docurl" placeholder="https://..." />
        </div>

        <div id="edge-fields">
          <label for="prop-arrow-style">Arrow style</label>
          <select id="prop-arrow-style">
            <option value="triangle">Triangle</option>
            <option value="vee">Vee</option>
            <option value="tee">Tee</option>
            <option value="circle">Circle</option>
            <option value="square">Square</option>
            <option value="diamond">Diamond</option>
            <option value="none">None</option>
          </select>

          <label for="prop-thickness">Thickness</label>
          <input type="number" id="prop-thickness" min="1" max="20" />

          <label for="prop-edge-color">Color</label>
          <input type="color" id="prop-edge-color" />

          <label for="prop-line-style">Line style</label>
          <select id="prop-line-style">
            <option value="solid">Solid</option>
            <option value="dashed">Dashed</option>
            <option value="dotted">Dotted</option>
          </select>
        </div>

        <p id="prop-id" class="prop-id"></p>
      </form>
    </aside>
  </div>

  <script src="vendor/cytoscape.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
